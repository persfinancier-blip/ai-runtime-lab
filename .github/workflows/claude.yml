name: Claude Worker

on:
  push:
    branches: ['task/**']

jobs:
  claude-task-push:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Trust checkout directory
        run: |
          python3 - <<'PY'
          import json, os
          path = os.path.expanduser('~/.claude.json')
          data = {}
          if os.path.exists(path):
              with open(path) as f:
                  data = json.load(f)
          data.setdefault('projects', {})[os.environ['GITHUB_WORKSPACE']] = {
              **data.get('projects', {}).get(os.environ['GITHUB_WORKSPACE'], {}),
              'hasTrustDialogAccepted': True,
          }
          with open(path, 'w') as f:
              json.dump(data, f)
          PY

      - name: Run Claude Code on dispatched task
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "This branch was created by the task dispatcher. Find the latest task prompt under prompts/ using git log -1 --name-only, read it, and execute it. Do not modify application code unless the prompt explicitly requires it. Follow repository instructions if present. Commit the completed work with git commit using a Conventional Commits message. Do NOT run git push and do NOT create a PR; those steps are automated after you finish. End your turn after the commit is made." --max-turns 1000 --dangerously-skip-permissions

      - name: Push Claude commit and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git log origin/${{ github.ref_name }}..HEAD --oneline)" ]; then
            echo "No new commits from Claude — nothing to push."
            exit 1
          fi
          git push origin HEAD:refs/heads/${{ github.ref_name }}
          TITLE=$(git log -1 --format=%s)
          gh pr create --base main --head "${{ github.ref_name }}" --title "$TITLE" --body "Opened automatically by the Claude test worker."

      - name: DoD gate
        id: gate
        run: |
          if [ -f scripts/dod.sh ]; then
            if bash scripts/dod.sh; then
              echo "passed=true" >> "$GITHUB_OUTPUT"
            else
              echo "passed=false" >> "$GITHUB_OUTPUT"
              echo "failed=scripts/dod.sh" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge on green gate
        if: steps.gate.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.ref_name }}" --merge --delete-branch || echo "Auto-merge blocked by repository settings"
